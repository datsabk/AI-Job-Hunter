# AIJobHunter portal configuration
#
# Each entry describes one place to collect jobs from. `adapter` selects the
# SourceAdapter implementation (see aijobhunter/sources/registry.py).
#
# AGGREGATOR-FIRST: Remotive + RSS pull role-relevant jobs across MANY companies
# with no company list — your keyword filter (from `aijobhunter keywords`)
# narrows them to your roles. Company-specific boards (greenhouse/lever/ashby)
# and LinkedIn are kept below but disabled; enable them to target one employer.
#
# NOTE: Greenhouse/Lever/Ashby have no global search API — they are per-company
# by design. For cross-company discovery by role, use the aggregators below.

portals:
  # ================= Aggregators (role-based, cross-company) =================

  # Remotive: public JSON API. Categories: software-dev, devops, data, design,
  # product, etc. Pull a whole category and let the keyword filter narrow it.
  - adapter: remotive
    enabled: true
    category: software-dev
    limit: 100

  # RSS: cross-company remote job feeds (We Work Remotely / RWFA / Remotive).
  - adapter: rss
    enabled: true
    feeds:
      - url: https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss
        label: rss:wwr-backend
      - url: https://realworkfromanywhere.com/remote-backend-jobs/rss.xml
        label: rss:rwfa-backend

  # ================= Company-specific boards (disabled by default) ===========
  - adapter: greenhouse   # boards.greenhouse.io/<company>
    enabled: false
    company: stripe
    title_includes: []

  - adapter: lever        # jobs.lever.co/<company>
    enabled: false
    company: netflix
    title_includes: []

  - adapter: ashby        # jobs.ashbyhq.com/<board>
    enabled: false
    company: ramp
    title_includes: []

  # ================= LinkedIn (opt-in, ToS risk, needs a browser) ============
  - adapter: linkedin
    enabled: false
    urls:
      - https://www.linkedin.com/jobs/search/?keywords=platform%20engineer&f_WT=2
    max_cards: 25
    max_minutes: 10
    headless: false
    scroll_pause_seconds: [2.0, 5.0]
    # Optional: drive your REAL logged-in Google Chrome profile instead of a
    # dedicated Playwright profile. Chrome must be FULLY QUIT first (profile lock).
    # use_real_chrome: true
    # chrome_profile: Default          # profile folder name
    # chrome_user_data_dir: ...        # unset = auto-detect OS default
