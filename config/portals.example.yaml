# AIJobHunter portal configuration
#
# Each entry describes one place to collect jobs from. `adapter` selects the
# SourceAdapter implementation (see aijobhunter/sources/registry.py). Add as many
# entries as you like across different portals.

portals:
  # --- Greenhouse: public JSON board API, no browser, near-zero risk. ---
  # `company` is the board token from a URL like boards.greenhouse.io/<company>.
  - adapter: greenhouse
    enabled: true
    company: stripe
    # Optional: only keep postings whose title matches one of these substrings
    # (case-insensitive). Leave empty to keep all and let the AI score them.
    title_includes: []

  # --- Lever: public postings API (jobs.lever.co/<company>), no browser. ---
  - adapter: lever
    enabled: false
    company: netflix
    title_includes: []

  # --- Ashby: public job-board API (jobs.ashbyhq.com/<board>), no browser. ---
  - adapter: ashby
    enabled: false
    company: ramp
    title_includes: []

  # --- Remotive: public JSON API of remote jobs, no browser, no auth. ---
  # Categories: software-dev, devops, data, design, product, etc.
  - adapter: remotive
    enabled: false
    category: software-dev
    search: platform engineer
    limit: 50

  # --- RSS: generic job feeds (Remotive / We Work Remotely / RWFA / ...). ---
  - adapter: rss
    enabled: false
    feeds:
      - url: https://remotive.com/remote-jobs/feed/devops
        label: rss:remotive-devops
      - url: https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss
        label: rss:wwr-backend
      - url: https://realworkfromanywhere.com/remote-backend-jobs/rss.xml
        label: rss:rwfa-backend

  # --- LinkedIn: automates YOUR logged-in browser. Higher risk (ToS). ---
  # Point `urls` at a saved job search or the feed. Runs attended (visible
  # browser) by default so you can handle login / 2FA and watch it work.
  - adapter: linkedin
    enabled: false
    urls:
      - https://www.linkedin.com/jobs/search/?keywords=platform%20engineer&f_WT=2
    # Safety caps for the browsing session.
    max_cards: 25          # stop after collecting this many job cards
    max_minutes: 10        # hard wall-clock cap for the session
    headless: false        # keep visible so you can intervene
    scroll_pause_seconds: [2.0, 5.0]   # randomized human-like pause range
