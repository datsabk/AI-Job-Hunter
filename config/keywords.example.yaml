# AIJobHunter keywords
#
# Normally generated by `aijobhunter keywords` (the LLM proposes include
# keywords from your résumé; you edit them and add exclusions). You can also
# hand-edit this file. Matching is case-insensitive substring matching over each
# job's title, company, location, and description.

# Keep a job if it matches AT LEAST ONE of these:
include:
  - platform engineer
  - backend engineer
  - kubernetes
  - python
  - go
  - distributed systems

# Reject a job if it matches ANY of these (takes precedence over include):
exclude:
  - intern
  - unpaid
  - clearance required
